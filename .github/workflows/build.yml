name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer-cmd: buildozer -v android debug
      - uses: actions/upload-artifact@v3
        with:
          name: apk
          path: bin/*.apk
